# Quarantine newly published versions by 24 hours to prevent supply-chain compromise
minimumReleaseAge: 1440

# Packages exempt from the 24-hour quarantine window
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
  # Renovate security update: @storybook/addon-vitest@10.6.2
  - "@storybook/addon-vitest@10.6.2"

# Explicitly allowed lifecycle scripts (replaces onlyBuiltDependencies)
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  # Optional native terminal for code-inspector's AI-agent feature; click-to-source works without it.
  node-pty: false

# Hardening & stability defaults
engineStrict: true
pmOnFail: error
runtimeOnFail: error
saveExact: true
strictPeerDependencies: true
preferFrozenLockfile: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  '@vitest/browser-playwright': 5.0.5
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
