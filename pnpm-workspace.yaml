# The app is the root package; relay/ runs the database drivers browsers can't (plan 11: https://github.com/deneslee/mantine-dashboard-builder/blob/0e400dd/.agents/planning/plans/done/11-optional-plugins.md).
packages:
  - relay

virtualStoreType: global

# Quarantine newly published versions by 24 hours to prevent supply-chain compromise
minimumReleaseAge: 1440

# Packages exempt from the 24-hour quarantine window
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'

# Explicitly allowed lifecycle scripts (replaces onlyBuiltDependencies)
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  # Optional native terminal for code-inspector's AI-agent feature; click-to-source works without it.
  node-pty: false

# Hardening & stability defaults
engineStrict: true
pmOnFail: error
runtimeOnFail: error
saveExact: true
strictPeerDependencies: true
preferFrozenLockfile: true
# `pnpm up` / `pnpm up -L` skip these. react-grid-layout stays on 2.2.4 (docs/upgrades/RGL.md);
# move it by hand with `pnpm add react-grid-layout@<version>` once RGL.md's "When to upgrade" holds.
updateConfig:
  ignoreDependencies:
    - react-grid-layout
# @mantine/hooks 9.7.4 imports react-dom (use-horizontal-collapse) without declaring it; the global
# virtual store only links declared deps. Drop once Mantine declares it.
packageExtensions:
  '@mantine/hooks@9':
    peerDependencies:
      react-dom: '^19.2.0'
  # storybook loads its framework and addon presets by name; same global-store linking gap.
  'storybook@10':
    peerDependencies:
      '@storybook/react-vite': '^10.6.4'
      '@storybook/addon-a11y': '^10.6.4'
      '@storybook/addon-docs': '^10.6.4'
      '@storybook/addon-mcp': '^10.6.4'
      '@storybook/addon-vitest': '^10.6.4'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  '@vitest/browser-playwright': 5.0.5
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  # The Vite+ toolchain stands in for these; Storybook 10.6 still asks for vite-plus 0.x.
  allowAny:
    - vite
    - vitest
    - vite-plus
  allowedVersions:
    vite: '*'
    vitest: '*'
    vite-plus: '*'
permissions:
  '@tanstack/devtools-vite':
    skills: false
  '@tanstack/react-router':
    skills: true
  '@tanstack/react-table':
    skills: true
  '@tanstack/router-plugin':
    skills: true
