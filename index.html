<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Dashboard Builder</title>
    <script>
      // Apply the saved color scheme before first paint (same key as Mantine's colorSchemeManager).
      try {
        var v = localStorage.getItem('color-scheme');
        var s =
          v === 'light' || v === 'dark'
            ? v
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', s);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">Loading…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
